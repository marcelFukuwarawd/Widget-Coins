plugins {
    id 'com.android.application'
}

android {
    namespace 'com.widgetcoins'
    compileSdk 35

    defaultConfig {
        applicationId 'com.widgetcoins'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave de debug para que o APK seja instalável diretamente.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
